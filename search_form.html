<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>Form Tìm kiếm</title>
</head>

<body>

    <h2>Tìm kiếm với Google</h2>
    <form action="https://www.google.com.vn/search" method="GET">
        <input type="text" name="q" placeholder="Nhập từ khóa Google..." />
        <input type="submit" value="Tìm kiếm" />
    </form>

    <hr>

    <h2>Tìm kiếm với Bing</h2>
    <!-- Đổi action sang trang tìm kiếm của Bing -->
    <form action="https://www.bing.com/search" method="GET">
        <input type="text" name="q" placeholder="Nhập từ khóa Bing..." />
        <input type="submit" value="Tìm kiếm" />
    </form>

</body>

</html>
